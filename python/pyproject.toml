[build-system]
requires = ["setuptools>=61.1"]
build-backend = "setuptools.build_meta"

[project]
name = "smc"
version = "0.2.0"
description = "Self-Modifying Calculator (SMC) — embeddable adaptive computation library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "coco-is-magik"},
]
keywords = ["calculator", "expression", "cache", "optimization", "embedding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/coco-is-magik/self-modifying-calculator"
Repository = "https://github.com/coco-is-magik/self-modifying-calculator"

[tool.setuptools]
package-dir = {"smc" = "smc"}
packages = ["smc"]
